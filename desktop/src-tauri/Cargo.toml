[package]
name = "accord"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
webview2-com = "0.39"
windows-core = "0.62"

# 配布物を小さくする
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
